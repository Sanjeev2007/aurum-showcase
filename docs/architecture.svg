<rect x="1064" y="318" width="224" height="83" rx="8" fill="#111e1c" stroke="#345a50"/>
<text x="1082" y="348" fill="#b8edda" font-size="20" font-weight="600">Local dashboard</text><text x="1082" y="378" fill="#a3c3b8" font-size="17">Reads the journal</text>
<text x="32" y="318" fill="#f0f0ef" font-size="19" font-weight="600">Authority is deliberately limited</text>
<text x="32" y="351" fill="#a3a8b7" font-size="18">Quant sets rank. Verified evidence may demote or veto, never promote.</text>
<text x="32" y="382" fill="#a3a8b7" font-size="18">News opens investigations. Missing evidence stays missing.</text>
